<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AETHER VANGUARD</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div class="hud-top">
            <div class="score-box">SCORE: <span id="score">0</span></div>
            <div class="time-box">TIME: <span id="time">00:00</span></div>
        </div>

        <div class="hud-bottom">
            <div class="bar-container">
                <label>SHIELD</label>
                <div class="bar-bg"><div id="shield-bar" class="bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="controls-hint">
                [W,A,S,D] MOVER &nbsp; | &nbsp; [ESPAÇO] ATIRAR &nbsp; | &nbsp; [SHIFT] TURBO
            </div>
        </div>

        <div id="start-screen" class="screen active">
            <h1 class="title">AETHER VANGUARD</h1>
            <p class="subtitle">PROJECT ALPHA v1.0</p>
            <button id="start-btn" class="cyber-btn">INICIAR MISSÃO</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h1 class="title danger">CRITICAL FAILURE</h1>
            <p id="final-score">SCORE FINAL: 0</p>
            <button id="restart-btn" class="cyber-btn">REINICIAR SISTEMA</button>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
