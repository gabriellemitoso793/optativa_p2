<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
  </head>

  <body>
    <a-scene shadow="type: pcfsoft">

      <!-- SOM DA MÚSICA -->
      <a-entity id="musica"
                sound="src: url(WhatIsThisFeeling.mp3); autoplay: true; volume: 1">
      </a-entity>

      <!-- LUZ AMBIENTE -->
      <a-entity light="type: ambient; intensity: 0.4"></a-entity>


      <!-- HOLOFOTES -->
      <a-entity light="type: spot; color: #00ff88; intensity: 1.2; angle: 20"
                position="-3 5 -2" rotation="-60 20 0" castShadow="true"></a-entity>

      <a-entity light="type: spot; color: #ff66cc; intensity: 1.2; angle: 20"
                position="3 5 -2" rotation="-60 -20 0" castShadow="true"></a-entity>


      <!-- PALCO -->
      <a-cylinder position="0 0 -4" radius="4.5" height="0.4"
                  color="#1f1f1f" shadow="cast: true; receive: true"></a-cylinder>


      <!-- CORTINAS TEATRAIS -->
      <a-plane position="-2.6 2.5 -3.7" width="2" height="4"
               rotation="0 12 0" color="#7a0046"></a-plane>

      <a-plane position="2.6 2.5 -3.7" width="2" height="4"
               rotation="0 -12 0" color="#7a0046"></a-plane>


      <!-- LINHA DIVISÓRIA – ELPHABA x GLINDA -->
      <a-plane position="0 1.5 -3.2" width="0.05" height="3.5" color="#ffffff"
               opacity="0.3">
        <a-animation attribute="opacity" from="0.2" to="0.5"
                     direction="alternate" dur="1500" repeat="indefinite"></a-animation>
      </a-plane>


      <!-- ORBE DE ENERGIA DA ELPHABA -->
      <a-sphere position="-1.2 1.7 -3" radius="0.7" color="#00ff88"
                opacity="0.75" shadow="cast: true">
        <a-animation attribute="position" to="-1.2 1.9 -3"
                     direction="alternate" dur="1400" repeat="indefinite"></a-animation>
        <a-animation attribute="scale" to="1.2 1.2 1.2"
                     direction="alternate" dur="1300" repeat="indefinite"></a-animation>
      </a-sphere>

      <!-- Partículas verdes -->
      <a-entity particle-system="preset: dust; color: #00ff88; particleCount: 250"
                position="-1.2 1.7 -3"></a-entity>


      <!-- ORBE ROSA DA GLINDA -->
      <a-sphere position="1.2 1.7 -3" radius="0.7" color="#ff66cc"
                opacity="0.75" shadow="cast: true">
        <a-animation attribute="position" to="1.2 1.9 -3"
                     direction="alternate" dur="1400" repeat="indefinite"></a-animation>
        <a-animation attribute="scale" to="1.2 1.2 1.2"
                     direction="alternate" dur="1300" repeat="indefinite"></a-animation>
      </a-sphere>

      <!-- Partículas rosa -->
      <a-entity particle-system="preset: snow; color: #ff66cc; particleCount: 250"
                position="1.2 1.7 -3"></a-entity>



      <!-- VASSOURA VOANDO (ANIMAÇÃO AVANÇADA) -->
      <a-entity position="0 2.2 -3">
        <a-cylinder height="1.4" radius="0.06" color="#6b4a2b" shadow="cast: true"></a-cylinder>
        <a-cone position="0 -0.9 0" radius-bottom="0.28" radius-top="0.02"
                height="0.7" color="#4a341f" shadow="cast: true"></a-cone>

        <!-- movimento senoidal -->
        <a-animation attribute="position"
                     to="0 2.5 -3"
                     direction="alternate"
                     dur="1800"
                     easing="ease-in-out"
                     repeat="indefinite"></a-animation>

        <a-animation attribute="rotation"
                     to="0 360 0"
                     dur="6000"
                     repeat="indefinite"></a-animation>
      </a-entity>



      <!-- GLOBO MÁGICO CENTRAL -->
      <a-sphere position="0 3 -3" radius="0.5" color="#a77bff" opacity="0.4">
        <a-animation attribute="rotation" to="0 360 0"
                     dur="9000" repeat="indefinite"></a-animation>
        <a-entity particle-system="preset: star; particleCount: 90; color: #a77bff"
                  position="0 0 0"></a-entity>
      </a-sphere>


      <!-- CAMERA VR -->
      <a-entity position="0 1.6 0">
        <a-camera wasd-controls-enabled="false"></a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
